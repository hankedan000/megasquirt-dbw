; PlatformIO project for the EThrottle firmware. The sources live alongside
; this file so the sketch layout is unchanged.
[platformio]
src_dir = .
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
    MegaCAN=https://github.com/hankedan000/MegaCAN.git#pio-lib-conversion
    PID=https://github.com/br3ttb/Arduino-PID-Library.git#9b4ca0e5b6d7bab9c6ac023e249d6af2446d99bb
    pidautotuner=https://github.com/jackw01/arduino-pid-autotuner.git#075c83e827572da9ccb12fa0fc852585d52f8d3a
; match the Arduino IDE's AVR build; the generated TABLES[] in
; EThrottleTables.h uses -1 as an "unused" uint16_t flash offset
build_flags = -Wno-error=narrowing
; src_dir is the project root, so keep the unit tests out of the firmware
build_src_filter = +<*> -<.git/> -<test/>
; unit tests are host-only; run them with `pio test -e native`
test_ignore = *

; host-side unit tests for the hardware independent code (header-only classes)
[env:native]
platform = native
build_flags = -I${PROJECT_DIR}
